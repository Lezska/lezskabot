<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QZone Tools</title>
    <style>
        :root {
            --bg: #f5f6fa;
            --card-bg: rgba(255, 255, 255, 0.7);
            --card-border: rgba(255, 255, 255, 0.6);
            --primary: #5b6abf;
            --primary-hover: #4a56a8;
            --danger: #d15b5b;
            --danger-hover: #b84a4a;
            --text: #2c3e50;
            --text-light: #7f8c8d;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.06);
            --radius: 16px;
            --input-bg: rgba(255, 255, 255, 0.8);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #e8ecf1 0%, #f0f3f8 50%, #e8ecf1 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 40px 20px;
            color: var(--text);
            position: relative;
        }
        .signature {
            position: fixed;
            left: 24px;
            bottom: 24px;
            font-size: 0.85rem;
            color: var(--text-light);
            opacity: 0.2;
            pointer-events: none;
            user-select: none;
        }
        .container { width: 100%; max-width: 1100px; display: flex; flex-direction: column; gap: 24px; }
        .nav { display: flex; gap: 12px; padding: 10px 0; }
        .nav-btn {
            padding: 10px 24px; border-radius: 30px;
            background: var(--card-bg); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.6); color: var(--text); font-weight: 500; cursor: pointer;
            transition: all 0.2s ease;
        }
        .nav-btn.active { background: var(--primary); color: white; border-color: var(--primary); box-shadow: 0 4px 12px rgba(91,106,191,0.3); }
        .content { display: none; }
        .content.active { display: block; }
        .card {
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            background: var(--card-bg); border: 1px solid var(--card-border);
            border-radius: var(--radius); box-shadow: var(--shadow); padding: 28px;
        }
        .section-title { font-size: 1.1rem; font-weight: 600; color: var(--primary); margin-bottom: 20px; padding-bottom: 10px; border-bottom: 1px solid rgba(0,0,0,0.06); }
        .field { margin-bottom: 16px; }
        label { display: block; font-size: 0.85rem; font-weight: 500; color: var(--text-light); margin-bottom: 6px; }
        input, textarea, select {
            width: 100%; padding: 10px 14px; border: 1px solid rgba(200,200,210,0.8); border-radius: 10px;
            background: var(--input-bg); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            font-size: 0.9rem; color: var(--text); transition: border 0.2s, box-shadow 0.2s;
        }
        input:focus, textarea:focus, select:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(91,106,191,0.15); }
        input[type="checkbox"] { width: auto; margin-right: 8px; accent-color: var(--primary); }
        .checkbox-wrap { display: flex; align-items: center; margin-bottom: 12px; font-size: 0.9rem; }
        .btn {
            display: inline-flex; align-items: center; justify-content: center;
            background: var(--primary); color: white; border: none; padding: 10px 24px; border-radius: 10px;
            font-size: 0.95rem; font-weight: 500; cursor: pointer; backdrop-filter: blur(8px);
            transition: background 0.2s;
        }
        .btn:hover { background: var(--primary-hover); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-danger { background: var(--danger); }
        .btn-danger:hover { background: var(--danger-hover); }
        .status { margin-top: 14px; padding: 10px 14px; border-radius: 10px; font-size: 0.85rem; display: none; }
        .status.show { display: block; }
        .status.success { background: rgba(46,204,113,0.15); color: #1e8449; }
        .status.error { background: rgba(231,76,60,0.15); color: #b03a2e; }
        .loading-text { font-size: 0.85rem; color: var(--primary); margin-left: 12px; }
        .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .list { margin-top: 12px; }
        .list-item {
            background: rgba(255,255,255,0.55); backdrop-filter: blur(10px);
            border-radius: 12px; padding: 14px 18px; margin-bottom: 8px;
            display: flex; justify-content: space-between; align-items: center;
            border: 1px solid rgba(255,255,255,0.5);
        }
        .list-item .info { flex: 1; min-width: 0; }
        .list-item .info strong { display: block; font-size: 0.95rem; margin-bottom: 4px; }
        .list-item .info .meta { font-size: 0.8rem; color: var(--text-light); }
        .list-item .actions { display: flex; gap: 8px; flex-shrink: 0; margin-left: 16px; }
        .empty { text-align: center; color: var(--text-light); padding: 20px 0; }
    </style>
</head>
<body>
    <div class="signature">Wyccotccy &amp; 烬熵Cinder(DEMO预览版，暂不支持编辑，还没研究清楚......）</div>
    <div class="container">
        <div class="card">
            <h1 style="font-size:1.5rem; font-weight:600; margin-bottom:6px;">QZone Tools</h1>
            <p style="font-size:0.9rem; color:var(--text-light);">配置、记忆与定时消息管理面板</p>
            <div class="nav" id="nav">
                <button class="nav-btn active" data-page="config">配置</button>
                <button class="nav-btn" data-page="memory">记忆</button>
                <button class="nav-btn" data-page="schedule">定时消息</button>
            </div>
        </div>

        <!-- 配置面板 -->
        <div id="configPage" class="content active">
            <div class="card">
                <div class="section-title">邮箱设置</div>
                <div class="field"><label>发件人邮箱</label><input id="email_sender" /></div>
                <div class="field"><label>授权码</label><input id="email_authorization_code" type="password" /></div>
                <div class="two-col">
                    <div class="field"><label>SMTP 服务器</label><input id="email_smtp_server" /></div>
                    <div class="field"><label>端口</label><input id="email_smtp_port" type="number" /></div>
                </div>
            </div>
            <div class="card" style="margin-top:20px;">
                <div class="section-title">记忆管理</div>
                <div class="field"><label>每用户最大记忆数</label><input id="max_memories_per_user" type="number" /></div>
                <div class="field"><label>LLM 注入最大条数</label><input id="max_inject_memories" type="number" /></div>
                <div class="checkbox-wrap"><input type="checkbox" id="memory_inject_enabled" /><label for="memory_inject_enabled">启用记忆注入</label></div>
            </div>
            <div class="card" style="margin-top:20px;">
                <div class="section-title">AI 语音</div>
                <div class="field"><label>默认角色 ID</label><input id="ai_voice_default_character" /></div>
                <div class="field"><label>文本最大长度</label><input id="ai_voice_max_text_length" type="number" /></div>
            </div>
            <div class="card" style="margin-top:20px;">
                <div class="section-title">输入状态 / 拟人化</div>
                <div class="checkbox-wrap"><input type="checkbox" id="auto_input_status_enabled" /><label for="auto_input_status_enabled">自动输入状态</label></div>
                <div class="field"><label>自动超时 (秒)</label><input id="auto_input_status_timeout" type="number" /></div>
                <div class="checkbox-wrap"><input type="checkbox" id="enable_human_typing" /><label for="enable_human_typing">拟人化延迟</label></div>
                <div class="two-col">
                    <div class="field"><label>延迟最小 (秒)</label><input id="typing_initial_delay_min" type="number" /></div>
                    <div class="field"><label>延迟最大 (秒)</label><input id="typing_initial_delay_max" type="number" /></div>
                    <div class="field"><label>空闲阈值 (秒)</label><input id="typing_idle_threshold" type="number" /></div>
                </div>
            </div>
            <div class="card" style="margin-top:20px;">
                <div class="section-title">全局开关</div>
                <div class="checkbox-wrap"><input type="checkbox" id="enabled" /><label for="enabled">启用插件</label></div>
                <div class="checkbox-wrap"><input type="checkbox" id="group_manage_enabled" /><label for="group_manage_enabled">群管理功能</label></div>
                <div class="checkbox-wrap"><input type="checkbox" id="kick_enabled" /><label for="kick_enabled">允许踢人</label></div>
                <div class="checkbox-wrap"><input type="checkbox" id="search_enabled" /><label for="search_enabled">联系人搜索</label></div>
            </div>
            <div class="card" style="margin-top:20px;">
                <button class="btn" id="saveConfigBtn">保存配置</button>
                <span id="configLoading" class="loading-text"></span>
                <div id="configStatus" class="status"></div>
            </div>
        </div>

        <!-- 记忆面板 -->
        <div id="memoryPage" class="content">
            <div class="card">
                <div class="section-title">搜索记忆</div>
                <div style="display:flex; gap:12px; margin-bottom:16px;">
                    <input id="memoryKeyword" placeholder="输入关键词搜索（留空显示全部）" style="flex:1" />
                    <button class="btn" id="searchMemoryBtn">搜索</button>
                </div>
                <div id="memoryList" class="list"></div>
                <div id="memoryStatus" class="status"></div>
            </div>
        </div>

        <!-- 定时消息面板 -->
        <div id="schedulePage" class="content">
            <div class="card">
                <div class="section-title">未执行的定时消息</div>
                <div id="scheduleList" class="list"></div>
                <div id="scheduleStatus" class="status"></div>
            </div>
            <div class="card" style="margin-top:20px;">
                <div class="section-title">新建定时消息</div>
                <div class="field"><label>目标ID (QQ号/群号)</label><input id="newTargetId" /></div>
                <div class="field"><label>消息内容</label><textarea id="newMessage" rows="2"></textarea></div>
                <div class="two-col">
                    <div class="field"><label>发送时间</label><input id="newSendTime" placeholder="例如 18:00 或 2026-05-10 18:00" /></div>
                    <div class="field"><label>类型</label>
                        <select id="newChatType">
                            <option value="group">群聊</option>
                            <option value="private">私聊</option>
                        </select>
                    </div>
                </div>
                <button class="btn" id="addScheduleBtn">创建定时</button>
            </div>
        </div>
    </div>

    <script type="module">
        const bridge = window.AstrBotPluginPage;
        if (!bridge) throw new Error("未检测到 AstrBotPluginPage");

        // 导航
        document.getElementById('nav').addEventListener('click', e => {
            if (e.target.classList.contains('nav-btn')) {
                document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                const page = e.target.dataset.page;
                document.querySelectorAll('.content').forEach(c => c.classList.remove('active'));
                document.getElementById(page + 'Page').classList.add('active');
                if (page === 'memory') loadMemories();
                if (page === 'schedule') loadSchedules();
            }
        });

        // ========== 配置 ==========
        const configStatus = document.getElementById('configStatus');
        const configLoading = document.getElementById('configLoading');
        const saveConfigBtn = document.getElementById('saveConfigBtn');

        function showConfigStatus(msg, type) {
            configStatus.textContent = msg;
            configStatus.className = `status show ${type}`;
            setTimeout(() => configStatus.classList.remove('show'), 3000);
        }

        function getFormValues() {
            return {
                email_sender: document.getElementById('email_sender').value,
                email_authorization_code: document.getElementById('email_authorization_code').value,
                email_smtp_server: document.getElementById('email_smtp_server').value,
                email_smtp_port: parseInt(document.getElementById('email_smtp_port').value) || 465,
                max_memories_per_user: parseInt(document.getElementById('max_memories_per_user').value) || 100,
                max_inject_memories: parseInt(document.getElementById('max_inject_memories').value) || 5,
                memory_inject_enabled: document.getElementById('memory_inject_enabled').checked,
                ai_voice_default_character: document.getElementById('ai_voice_default_character').value,
                ai_voice_max_text_length: parseInt(document.getElementById('ai_voice_max_text_length').value) || 500,
                auto_input_status_enabled: document.getElementById('auto_input_status_enabled').checked,
                auto_input_status_timeout: parseInt(document.getElementById('auto_input_status_timeout').value) || 10,
                enable_human_typing: document.getElementById('enable_human_typing').checked,
                typing_idle_threshold: parseInt(document.getElementById('typing_idle_threshold').value) || 900,
                typing_initial_delay_min: parseInt(document.getElementById('typing_initial_delay_min').value) || 5,
                typing_initial_delay_max: parseInt(document.getElementById('typing_initial_delay_max').value) || 15,
                enabled: document.getElementById('enabled').checked,
                group_manage_enabled: document.getElementById('group_manage_enabled').checked,
                kick_enabled: document.getElementById('kick_enabled').checked,
                search_enabled: document.getElementById('search_enabled').checked,
            };
        }

        async function loadConfig() {
            try {
                const res = await bridge.apiGet('get_config');
                if (!res.success) throw new Error(res.error || '加载失败');
                const cfg = res.config;
                Object.entries(cfg).forEach(([key, val]) => {
                    const el = document.getElementById(key);
                    if (!el) return;
                    if (el.type === 'checkbox') el.checked = val ?? false;
                    else el.value = val ?? '';
                });
            } catch (e) {
                console.error(e);
            }
        }

        saveConfigBtn.addEventListener('click', async () => {
            configLoading.textContent = '保存中...';
            saveConfigBtn.disabled = true;
            try {
                const res = await bridge.apiPost('save_config', { config: getFormValues() });
                if (res.success) {
                    showConfigStatus('配置已保存', 'success');
                } else {
                    showConfigStatus(res.error || '保存失败', 'error');
                }
            } catch (e) {
                showConfigStatus(e.message, 'error');
            } finally {
                configLoading.textContent = '';
                saveConfigBtn.disabled = false;
            }
        });

        // ========== 记忆 ==========
        const memoryStatus = document.getElementById('memoryStatus');

        function showMemoryStatus(msg, type) {
            memoryStatus.textContent = msg;
            memoryStatus.className = `status show ${type}`;
            setTimeout(() => memoryStatus.classList.remove('show'), 3000);
        }

        async function loadMemories(keyword = '') {
            const container = document.getElementById('memoryList');
            try {
                const res = await bridge.apiGet('memories', { keyword, limit: 99999 });
                if (!res.success) {
                    container.innerHTML = `<div class="empty">加载失败: ${escapeHtml(res.error || '未知错误')}</div>`;
                    return;
                }
                const arr = res.memories || [];
                if (arr.length === 0) {
                    container.innerHTML = '<div class="empty">没有记忆</div>';
                    return;
                }
                container.innerHTML = arr.map(m => `
                    <div class="list-item">
                        <div class="info">
                            <strong>${escapeHtml(m.content)}</strong>
                            <div class="meta">用户:${escapeHtml(m.user_id)} | 标签:${escapeHtml((m.tags||[]).join(', '))} | 重要:${m.importance} | ${m.updated_at}</div>
                        </div>
                        <div class="actions"><button class="btn btn-danger" data-mid="${m.id}">删除</button></div>
                    </div>`).join('');
                container.querySelectorAll('.btn-danger').forEach(b => b.addEventListener('click', () => deleteMemory(b.dataset.mid)));
            } catch (e) {
                container.innerHTML = `<div class="empty">请求错误: ${escapeHtml(e.message)}</div>`;
            }
        }

        async function deleteMemory(id) {
            if (!confirm('确定删除该记忆？')) return;
            try {
                const res = await bridge.apiPost('delete_memory', { memory_id: id });
                if (res.success) {
                    showMemoryStatus(res.message || '已删除', 'success');
                    loadMemories(document.getElementById('memoryKeyword').value);
                } else {
                    showMemoryStatus(res.error || '删除失败', 'error');
                }
            } catch (e) {
                showMemoryStatus(e.message, 'error');
            }
        }

        document.getElementById('searchMemoryBtn').addEventListener('click', () => loadMemories(document.getElementById('memoryKeyword').value));

        // ========== 定时消息 ==========
        const scheduleStatus = document.getElementById('scheduleStatus');

        function showScheduleStatus(msg, type) {
            scheduleStatus.textContent = msg;
            scheduleStatus.className = `status show ${type}`;
            setTimeout(() => scheduleStatus.classList.remove('show'), 3000);
        }

        async function loadSchedules() {
            const container = document.getElementById('scheduleList');
            try {
                const res = await bridge.apiGet('scheduled_messages');
                if (!res.success) {
                    container.innerHTML = `<div class="empty">加载失败: ${escapeHtml(res.error || '未知错误')}</div>`;
                    return;
                }
                const tasks = res.tasks || [];
                if (tasks.length === 0) {
                    container.innerHTML = '<div class="empty">暂无未执行定时消息</div>';
                    return;
                }
                container.innerHTML = tasks.map(t => `
                    <div class="list-item">
                        <div class="info">
                            <strong>${escapeHtml(t.message)}</strong>
                            <div class="meta">目标:${escapeHtml(t.target_id)} | 时间:${t.send_time} | 类型:${t.chat_type==='group'?'群聊':'私聊'}</div>
                        </div>
                        <div class="actions"><button class="btn btn-danger" data-tid="${t.task_id}">取消</button></div>
                    </div>`).join('');
                container.querySelectorAll('.btn-danger').forEach(b => b.addEventListener('click', () => cancelSchedule(b.dataset.tid)));
            } catch (e) {
                container.innerHTML = `<div class="empty">请求错误: ${escapeHtml(e.message)}</div>`;
            }
        }

        async function cancelSchedule(id) {
            if (!confirm('确定取消该定时消息？')) return;
            try {
                const res = await bridge.apiPost('cancel_scheduled_message', { task_id: id });
                if (res.success) {
                    showScheduleStatus(res.message || '已取消', 'success');
                    loadSchedules();
                } else {
                    showScheduleStatus(res.error || '取消失败', 'error');
                }
            } catch (e) {
                showScheduleStatus(e.message, 'error');
            }
        }

        document.getElementById('addScheduleBtn').addEventListener('click', async () => {
            const target = document.getElementById('newTargetId').value.trim();
            const message = document.getElementById('newMessage').value.trim();
            const sendTime = document.getElementById('newSendTime').value.trim();
            const chatType = document.getElementById('newChatType').value;
            if (!target || !message || !sendTime) {
                showScheduleStatus('请填写完整信息', 'error');
                return;
            }
            try {
                const res = await bridge.apiPost('add_scheduled_message', {
                    target_id: target,
                    message: message,
                    send_time: sendTime,
                    chat_type: chatType
                });
                if (res.success) {
                    showScheduleStatus(res.message || '定时消息已创建', 'success');
                    document.getElementById('newTargetId').value = '';
                    document.getElementById('newMessage').value = '';
                    document.getElementById('newSendTime').value = '';
                    loadSchedules();
                } else {
                    showScheduleStatus(res.error || '创建失败', 'error');
                }
            } catch (e) {
                showScheduleStatus(e.message, 'error');
            }
        });

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.appendChild(document.createTextNode(text));
            return div.innerHTML;
        }

        // 初始化
        (async () => {
            await bridge.ready();
            await loadConfig();
        })();
    </script>
</body>
</html>
